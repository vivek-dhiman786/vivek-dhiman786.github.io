<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My To-Do List</title>
<style>
body{background:#111;color:white;font-family:sans-serif;text-align:center;padding:20px}
h1{color:#00ff88}
input{padding:12px;width:70%;border-radius:20px;border:none;outline:none}
button{padding:12px 18px;border:none;border-radius:20px;background:#00ff88;font-weight:bold}
ul{list-style:none;padding:0}
li{background:#222;padding:12px;margin:8px auto;border-radius:12px;max-width:400px;display:flex;justify-content:space-between}
li span{cursor:pointer}
.done{text-decoration:line-through;opacity:0.5}
</style>
</head>
<body>
<h1>✅ My To-Do List</h1>
<input id="task" placeholder="Naya kaam likh...">
<button onclick="add()">Add</button>
<ul id="list"></ul>
<script>
function add(){
  let t=document.getElementById('task').value;
  if(t=="") return;
  let li=document.createElement('li');
  li.innerHTML="<span onclick='this.classList.toggle(\"done\")'>"+t+"</span> <span onclick='this.parentElement.remove()'>❌</span>";
  document.getElementById('list').appendChild(li);
  document.getElementById('task').value="";
}
</script>
</body>
</html>
